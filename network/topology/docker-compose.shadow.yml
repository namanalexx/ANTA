name: anta-shadow

x-node: &node
  image: anta-node:latest
  cap_add:
    - NET_ADMIN
  init: true
  restart: "no"

networks:
  net_client:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 10.20.1.0/24
  net_core:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 10.20.2.0/24
  net_servers:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        - subnet: 10.20.3.0/24

services:
  client:
    <<: *node
    container_name: shadow-client
    hostname: shadow-client
    networks:
      net_client:
        ipv4_address: 10.20.1.10
    environment:
      IP_PREFIX: "10.20"
      ROUTES: "default via 10.20.1.2"

  router:
    <<: *node
    container_name: shadow-router
    hostname: shadow-router
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      net_client:
        ipv4_address: 10.20.1.2
      net_core:
        ipv4_address: 10.20.2.2
    environment:
      IP_PREFIX: "10.20"
      ROUTES: "10.20.3.0/24 via 10.20.2.3"

  firewall:
    <<: *node
    container_name: shadow-firewall
    hostname: shadow-firewall
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      net_core:
        ipv4_address: 10.20.2.3
      net_servers:
        ipv4_address: 10.20.3.2
    environment:
      IP_PREFIX: "10.20"
      ROUTES: "10.20.1.0/24 via 10.20.2.2"

  dns-server:
    <<: *node
    container_name: shadow-dns-server
    hostname: shadow-dns-server
    networks:
      net_servers:
        ipv4_address: 10.20.3.10
    environment:
      IP_PREFIX: "10.20"
      ROLE: dns
      ROUTES: "default via 10.20.3.2"

  web-server:
    <<: *node
    container_name: shadow-web-server
    hostname: shadow-web-server
    networks:
      net_servers:
        ipv4_address: 10.20.3.20
    environment:
      IP_PREFIX: "10.20"
      ROLE: web
      ROUTES: "default via 10.20.3.2"
